<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a3a3c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8e8e93"/>
    </marker>
    <style>
      .t{font-weight:600;fill:#1d1d1f}.s{fill:#6e6e73;font-size:11.5px}.zone{fill:none;stroke:#c7c7cc;stroke-dasharray:5 4}
      .box{fill:#fff;stroke:#d1d1d6;rx:10}.ln{stroke:#3a3a3c;stroke-width:1.6;fill:none}.lg{stroke:#8e8e93;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1120" height="760" fill="#fafafa"/>

  <!-- title -->
  <text x="32" y="40" font-size="20" class="t">Highly available web app on AWS (ap-south-1)</text>
  <text x="32" y="62" class="s">Terraform for everything below, deployed by GitHub Actions. Solid arrows: request path. Dashed: control and data plane.</text>

  <!-- users -->
  <rect x="32" y="300" width="120" height="64" rx="10" class="box"/>
  <text x="92" y="328" text-anchor="middle" class="t">Users</text>
  <text x="92" y="346" text-anchor="middle" class="s">HTTPS only</text>

  <!-- route53/acm -->
  <rect x="32" y="120" width="150" height="72" rx="10" class="box"/>
  <text x="107" y="148" text-anchor="middle" class="t">Route 53</text>
  <text x="107" y="166" text-anchor="middle" class="s">alias A record</text>
  <text x="107" y="180" text-anchor="middle" class="s">+ ACM DNS validation</text>

  <!-- VPC -->
  <rect x="200" y="90" width="660" height="620" rx="16" fill="#fff" stroke="#8e8e93" stroke-width="1.4"/>
  <text x="220" y="116" class="t">VPC 10.20.0.0/16</text>

  <!-- AZ columns -->
  <rect x="220" y="130" width="300" height="560" rx="12" class="zone"/>
  <text x="236" y="152" class="s">Availability Zone A</text>
  <rect x="540" y="130" width="300" height="560" rx="12" class="zone"/>
  <text x="556" y="152" class="s">Availability Zone B</text>

  <!-- tier bands -->
  <rect x="230" y="166" width="600" height="130" rx="10" fill="#eef6ff"/>
  <text x="244" y="186" class="s">Public subnets 10.20.0.0/24, 10.20.1.0/24  (route: Internet Gateway)</text>
  <rect x="230" y="316" width="600" height="190" rx="10" fill="#f1f8ee"/>
  <text x="244" y="336" class="s">Private app subnets 10.20.10.0/24, 10.20.11.0/24  (route: NAT Gateway)</text>
  <rect x="230" y="526" width="600" height="150" rx="10" fill="#fdf3ea"/>
  <text x="244" y="546" class="s">Private database subnets 10.20.20.0/24, 10.20.21.0/24  (no internet route)</text>

  <!-- ALB spanning -->
  <rect x="300" y="200" width="460" height="56" rx="10" class="box" stroke="#0a84ff"/>
  <text x="530" y="224" text-anchor="middle" class="t">Application Load Balancer</text>
  <text x="530" y="242" text-anchor="middle" class="s">443 TLS 1.2/1.3 (ACM cert) · 80 redirects to 443 · health check /health</text>

  <!-- NAT -->
  <rect x="236" y="262" width="96" height="28" rx="8" fill="#fff" stroke="#d1d1d6"/>
  <text x="284" y="281" text-anchor="middle" class="s">NAT Gateway</text>

  <!-- ASG -->
  <rect x="270" y="350" width="520" height="140" rx="12" fill="none" stroke="#30a14e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="530" y="370" text-anchor="middle" class="t" fill="#1b7f3a">Auto Scaling Group · min 2 · max 4 · CPU target 50%</text>
  <rect x="300" y="384" width="180" height="88" rx="10" class="box"/>
  <text x="390" y="410" text-anchor="middle" class="t">EC2 (AL2023)</text>
  <text x="390" y="428" text-anchor="middle" class="s">Node.js app :8080</text>
  <text x="390" y="444" text-anchor="middle" class="s">IMDSv2 · encrypted EBS</text>
  <text x="390" y="460" text-anchor="middle" class="s">no SSH, SSM only</text>
  <rect x="580" y="384" width="180" height="88" rx="10" class="box"/>
  <text x="670" y="410" text-anchor="middle" class="t">EC2 (AL2023)</text>
  <text x="670" y="428" text-anchor="middle" class="s">Node.js app :8080</text>
  <text x="670" y="444" text-anchor="middle" class="s">launch template</text>
  <text x="670" y="460" text-anchor="middle" class="s">rolling instance refresh</text>

  <!-- RDS -->
  <rect x="300" y="566" width="180" height="92" rx="10" class="box" stroke="#e8890c"/>
  <text x="390" y="592" text-anchor="middle" class="t">RDS MySQL 8.0</text>
  <text x="390" y="610" text-anchor="middle" class="s">encrypted storage</text>
  <text x="390" y="626" text-anchor="middle" class="s">TLS required</text>
  <text x="390" y="642" text-anchor="middle" class="s">7-day backups</text>
  <rect x="580" y="566" width="180" height="92" rx="10" fill="#fff" stroke="#e8890c" stroke-dasharray="5 4"/>
  <text x="670" y="600" text-anchor="middle" class="t">Standby</text>
  <text x="670" y="618" text-anchor="middle" class="s">Multi-AZ (db_multi_az)</text>
  <text x="670" y="634" text-anchor="middle" class="s">off by default for cost</text>

  <!-- right-side AWS services -->
  <rect x="890" y="120" width="200" height="74" rx="10" class="box"/>
  <text x="990" y="148" text-anchor="middle" class="t">S3 app bucket</text>
  <text x="990" y="166" text-anchor="middle" class="s">releases/ and uploads/</text>
  <text x="990" y="182" text-anchor="middle" class="s">versioned · TLS-only · private</text>

  <rect x="890" y="212" width="200" height="66" rx="10" class="box"/>
  <text x="990" y="240" text-anchor="middle" class="t">S3 ALB access logs</text>
  <text x="990" y="258" text-anchor="middle" class="s">30-day expiry · SSE-S3</text>

  <rect x="890" y="300" width="200" height="74" rx="10" class="box"/>
  <text x="990" y="328" text-anchor="middle" class="t">Secrets Manager</text>
  <text x="990" y="346" text-anchor="middle" class="s">DB credentials, generated</text>
  <text x="990" y="362" text-anchor="middle" class="s">and managed by RDS</text>

  <rect x="890" y="392" width="200" height="58" rx="10" class="box"/>
  <text x="990" y="418" text-anchor="middle" class="t">SSM Parameter Store</text>
  <text x="990" y="436" text-anchor="middle" class="s">current release version</text>

  <rect x="890" y="468" width="200" height="66" rx="10" class="box"/>
  <text x="990" y="496" text-anchor="middle" class="t">CloudWatch + SNS</text>
  <text x="990" y="514" text-anchor="middle" class="s">5xx, unhealthy hosts,</text>
  <text x="990" y="528" text-anchor="middle" class="s">latency, DB CPU and disk</text>

  <rect x="890" y="580" width="200" height="96" rx="10" class="box" stroke="#6e40c9"/>
  <text x="990" y="606" text-anchor="middle" class="t">GitHub Actions</text>
  <text x="990" y="624" text-anchor="middle" class="s">OIDC role, no stored keys</text>
  <text x="990" y="640" text-anchor="middle" class="s">plan on PR, apply on main</text>
  <text x="990" y="656" text-anchor="middle" class="s">app: test, release, refresh</text>

  <!-- request path -->
  <path d="M152 332 H 220 V 228 H 300" class="ln" marker-end="url(#a)"/>
  <path d="M107 192 V 228 H 220" class="lg"/>
  <path d="M430 256 V 384" class="ln" marker-end="url(#a)"/>
  <path d="M630 256 V 384" class="ln" marker-end="url(#a)"/>
  <path d="M390 472 V 566" class="ln" marker-end="url(#a)"/>
  <path d="M670 472 V 520 H 440 V 566" class="ln" marker-end="url(#a)"/>
  <path d="M480 612 H 580" class="lg" marker-end="url(#g)"/>
  <text x="530" y="604" text-anchor="middle" class="s">sync replica</text>

  <!-- control/data plane -->
  <path d="M760 228 H 870 V 245 H 890" class="lg" marker-end="url(#g)"/>
  <path d="M760 428 H 850 V 157 H 890" class="lg" marker-end="url(#g)"/>
  <path d="M850 337 H 890" class="lg" marker-end="url(#g)"/>
  <path d="M850 421 H 890" class="lg" marker-end="url(#g)"/>
  <path d="M990 580 V 550" class="lg"/>
  <text x="200" y="738" class="s">The app tier reaches S3 through a gateway VPC endpoint and other AWS APIs through the NAT Gateway. RDS has no route out at all.</text>
</svg>
